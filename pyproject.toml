[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphweave"
version = "0.1.0"
description = "Local GitHub repository tracing with a bundled interactive graph viewer."
readme = "README.md"
requires-python = ">=3.12"
# Local GitHub ingestion dependencies. The tracing/viewer modules use only stdlib.
dependencies = ["httpx>=0.28,<0.29", "pydantic>=2.13,<3", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
backend = [
    "sqlmodel>=0.0.16", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4",
    "celery[redis]>=5.4,<6", "redis>=5,<7", "slowapi>=0.1.9", "cryptography>=43,<47",
]
adapter = ["langchain-core>=1.5,<2"]
examples = ["langgraph>=1.2,<2"]
extraction = ["spacy>=3.7,<4"]
embeddings = ["sentence-transformers>=5,<6"]
graph = ["ladybug"]
judge = ["openai>=3.3,<4"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1", "pyjwt[crypto]>=2.9,<3"]
sentry = ["sentry-sdk[fastapi]>=2.0.0"]
dev = [
    "pytest>=9,<10",
    "graphweave[adapter,examples,embeddings,graph,judge,api,backend]",
]

[project.scripts]
graphweave = "graphrag.entry:main"
graphweave-view = "graphrag.tracing.web:main"
graphweave-github-trace = "graphrag.local_github:main"
graphweave-backend = "graphrag.cli:main"

# Source tests import src; the distribution installs these modules as graphrag.
[tool.setuptools]
package-dir = { "graphrag" = "src" }
include-package-data = false
packages = [
    "graphrag", "graphrag.adapters", "graphrag.analysis", "graphrag.api",
    "graphrag.common", "graphrag.graphdb", "graphrag.models", "graphrag.ingestion",
    "graphrag.knowledge", "graphrag.repository", "graphrag.retrieval",
    "graphrag.tracing", "graphrag.worker",
]

[tool.setuptools.package-data]
"graphrag.tracing" = ["ui/viewer.html", "ui/assets/*"]
