name: tests

# On every push and every pull request, from a clean checkout. Nothing here
# depends on a previously built virtual environment or a cached artifact — the
# point of this workflow is that the suite passes for someone who has just
# cloned the repository.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The floor declared in pyproject.toml. Raising one without the other
          # is how a project starts claiming support it does not test.
          python-version: "3.12"

      # The full install, dependencies included. The packaging test installs
      # with --no-deps so it stays offline; this is where the real resolution
      # is exercised.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q
