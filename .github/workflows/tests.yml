name: tests

# On every push and every pull request, from a clean checkout. Nothing here
# depends on a previously built virtual environment or a cached artifact — the
# point of this workflow is that the suite passes for someone who has just
# cloned the repository.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The floor declared in pyproject.toml. Raising one without the other
          # is how a project starts claiming support it does not test.
          python-version: "3.12"

      # The full install, dependencies included. `dev` pulls in
      # sentence-transformers and therefore torch, which entity resolution now
      # requires — there is no lighter path to fall back to, so CI runs the
      # real embedder or it runs nothing.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Downloaded once and cached; otherwise every run pays ~90 MB and the
      # first test to touch the model pays the latency.
      - name: Cache the sentence-transformer model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2-v1

      - name: Test
        run: python -m pytest -q
