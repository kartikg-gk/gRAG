name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: python tools/check_static_bundle.py
      - run: python tools/bundle_viewer.py
      - run: python -m pip install --upgrade pip build twine pytest
      - run: python -m pip install ".[adapter]"
      - run: python -m unittest discover -s tests -v
      - run: python -m pytest -q tests
      - run: python -m build -o dist/
      - run: python tools/check_wheel.py dist/*.whl
      - run: python -m twine check dist/*
      - run: graphweave-view --help
      - run: graphweave-github-trace --help

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  backend-tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install ".[backend,api,graph,embeddings,judge,sentry,adapter,examples]" pytest
      - run: python -m compileall -q src
      - run: python -c "import graphrag, graphrag.api.app, graphrag.worker.app, graphrag.worker.tasks, graphrag.worker.compile, graphrag.cli, graphrag.agent_tools"
      - run: python -c "import redis; assert redis.Redis(host='127.0.0.1', port=6379).ping()"
      # Packaging is verified in the package job after its frontend build.
      - run: python -m pytest -q src/tests --ignore=src/tests/test_packaging.py
