# Services this project needs running locally.
#
# Redis only, for now. The database the control plane lives in is configured
# separately as a local instance and is deliberately not here: a second,
# containerised one would be a second control plane on the same machine, and
# whichever process read the wrong one would be quietly serving from a fleet
# that does not exist.
services:
  redis:
    image: redis:7-alpine
    # Back whenever the Docker engine is. Without a policy a restart of the
    # engine leaves Redis stopped, and the lock and queue tests skip rather
    # than fail, so the outage reads as a smaller suite instead of an error.
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      # The client is in the image, so readiness needs nothing installed on
      # the host and nothing built into this file beyond the check itself.
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
